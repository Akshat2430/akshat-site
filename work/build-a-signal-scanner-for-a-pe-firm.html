<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>How do you turn a thousand updates into one brief a team actually reads? — Akshat Kharbanda</title>
  <meta name="description" content="A thousand daily updates → one standing brief for a 10-person team. Case study by Akshat Kharbanda — cross-cultural strategist and AI adoption consultant." />
  <link rel="canonical" href="https://akshatkharbanda.com/work/build-a-signal-scanner-for-a-pe-firm.html" />

  <!-- Open Graph -->
  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="Akshat Kharbanda" />
  <meta property="og:title" content="How do you turn a thousand updates into one brief a team actually reads? — Akshat Kharbanda" />
  <meta property="og:description" content="A thousand daily updates → one standing brief for a 10-person team. Case study by Akshat Kharbanda." />
  <meta property="og:url" content="https://akshatkharbanda.com/work/build-a-signal-scanner-for-a-pe-firm.html" />
  <meta property="og:image" content="https://akshatkharbanda.com/public/images/og-image.jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <link rel="icon" type="image/jpeg" href="/public/images/akshat-avatar.jpg" />
  <link rel="apple-touch-icon" href="/public/images/akshat-avatar.jpg" />
  <link rel="stylesheet" href="../styles.css" />
  <script src="../data/cases.js"></script>
  <script src="../nav.js" defer></script>
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body>

<main class="page">
  <div class="container">
    <div id="case-content"></div>
  </div>
</main>

<script>
function getSlug() {
  const parts = window.location.pathname.split('/');
  const file = parts[parts.length - 1];
  return file.replace('.html', '');
}

function getCaseNav(currentSlug) {
  const idx = cases.findIndex(c => c.slug === currentSlug);
  const prev = idx > 0 ? cases[idx - 1] : null;
  const next = idx < cases.length - 1 ? cases[idx + 1] : null;
  return { prev, next };
}

document.addEventListener('DOMContentLoaded', function() {
  const slug = getSlug();
  const c = cases.find(cs => cs.slug === slug);

  if (!c) {
    document.getElementById('case-content').innerHTML = `
      <p style="color: var(--text-secondary);">Case study not found. <a href="../work.html" style="color: var(--accent);">Back to work →</a></p>
    `;
    return;
  }

  document.title = `${c.question} — Akshat Kharbanda`;
  document.querySelector('meta[name="description"]').content = c.subtitle;

  const { prev, next } = getCaseNav(slug);

  document.getElementById('case-content').innerHTML = `
    <div class="case-hero">
      <a href="../work.html" class="case-back">← Back to work</a>
      <span class="tag tag-${c.category}">${c.category}</span>
      <h1 class="case-title">${c.question}</h1>
      <p class="case-subtitle">${c.subtitle}</p>
      <div class="case-meta">
        <div class="case-meta-item">
          <div class="case-meta-label">Client</div>
          <div class="case-meta-val">${c.client}</div>
        </div>
        <div class="case-meta-item">
          <div class="case-meta-label">Context</div>
          <div class="case-meta-val">${c.context}</div>
        </div>
        <div class="case-meta-item">
          <div class="case-meta-label">Category</div>
          <div class="case-meta-val">${c.category}</div>
        </div>
      </div>
    </div>

    <hr class="divider" />

    <div class="case-section">
      <p class="case-section-title">The problem</p>
      <p class="case-body">${c.problem}</p>
    </div>

    <div class="case-section">
      <p class="case-section-title">What I did</p>
      <p class="case-body">${c.what_i_did}</p>
    </div>

    <hr class="divider" />

    <div class="case-section">
      <p class="case-section-title">Outcomes</p>
      <div class="outcomes-grid">
        ${c.outcomes.map(o => `
          <div class="outcome-card">
            <div class="outcome-num">${o.number}</div>
            <div class="outcome-label">${o.label}</div>
          </div>
        `).join('')}
      </div>
    </div>

    <hr class="divider" />

    <div class="case-section">
      <p class="case-section-title">What I learned</p>
      ${c.learnings.map(l => `
        <div class="learning-item">
          <p class="learning-text">${l}</p>
        </div>
      `).join('')}
    </div>

    <hr class="divider" />

    <div class="case-nav">
      ${prev ? `<a href="${prev.slug}.html" class="case-nav-btn">← ${prev.question.substring(0, 40)}…</a>` : '<span></span>'}
      ${next ? `<a href="${next.slug}.html" class="case-nav-btn">${next.question.substring(0, 40)}… →</a>` : '<span></span>'}
    </div>
  `;
});
</script>

</body>
</html>
